<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="type-title type-desc">
  <title id="type-title">Portfolio type scale</title>
  <desc id="type-desc">Type scale for natemills.me. Inter for body and display, JetBrains Mono for mono labels. Sizes from 10px mono labels through 64px display.</desc>

  <defs>
    <style>
      .display { font-family: "Inter", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.024em; }
      .body    { font-family: "Inter", system-ui, sans-serif; font-weight: 400; }
      .mono    { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500; letter-spacing: 0.04em; }
      .label   { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
      .gauge   { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; }
      .title   { font-family: "Inter", system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
      .eyebrow { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
      .ink-40  { fill: rgba(28,28,31,0.40); }
      .ink-60  { fill: rgba(28,28,31,0.60); }
    </style>
  </defs>

  <!-- Paper ground -->
  <rect width="1200" height="760" fill="#f5f5f3"/>

  <!-- Header -->
  <circle cx="64" cy="68" r="4" fill="#d2ff37"/>
  <text x="80" y="72" class="eyebrow ink-60">Typography</text>
  <text x="64" y="116" class="title" fill="#1c1c1f">Type scale<tspan fill="#d2ff37">.</tspan></text>
  <line x1="64" y1="148" x2="120" y2="148" stroke="#1c1c1f" stroke-width="3"/>

  <!-- Ruler: vertical axis with size markers on the left, sample on right -->
  <!-- Each step: gauge text + sample. Heights chosen so baselines align. -->

  <!-- 64px display -->
  <text x="64"  y="240" class="gauge ink-60">64 / 1.0</text>
  <text x="64"  y="240" class="display" fill="#1c1c1f" font-size="64" dx="120">Display.</text>
  <line x1="64" y1="252" x2="1136" y2="252" stroke="rgba(28,28,31,0.08)"/>

  <!-- 48px display -->
  <text x="64"  y="308" class="gauge ink-60">48 / 1.05</text>
  <text x="64"  y="308" class="display" fill="#1c1c1f" font-size="48" dx="120">Section heading.</text>
  <line x1="64" y1="320" x2="1136" y2="320" stroke="rgba(28,28,31,0.08)"/>

  <!-- 32px display -->
  <text x="64"  y="364" class="gauge ink-60">32 / 1.1</text>
  <text x="64"  y="364" class="display" fill="#1c1c1f" font-size="32" dx="120">Sub-section heading.</text>
  <line x1="64" y1="376" x2="1136" y2="376" stroke="rgba(28,28,31,0.08)"/>

  <!-- 22px body bold -->
  <text x="64"  y="412" class="gauge ink-60">22 / 1.3</text>
  <text x="64"  y="412" class="body" fill="#1c1c1f" font-size="22" font-weight="600" dx="120">Lead paragraph and pull quotes.</text>
  <line x1="64" y1="424" x2="1136" y2="424" stroke="rgba(28,28,31,0.08)"/>

  <!-- 16px body -->
  <text x="64"  y="456" class="gauge ink-60">16 / 1.5</text>
  <text x="64"  y="456" class="body" fill="rgba(28,28,31,0.78)" font-size="16" dx="120">Body copy. The default reading size, comfortable at 60-70 character measures.</text>
  <line x1="64" y1="468" x2="1136" y2="468" stroke="rgba(28,28,31,0.08)"/>

  <!-- 13px body small -->
  <text x="64"  y="496" class="gauge ink-60">13 / 1.4</text>
  <text x="64"  y="496" class="body" fill="rgba(28,28,31,0.78)" font-size="13" dx="120">Small body, captions, metadata, and form field hints.</text>
  <line x1="64" y1="508" x2="1136" y2="508" stroke="rgba(28,28,31,0.08)"/>

  <!-- 11px mono label -->
  <text x="64"  y="532" class="gauge ink-60">11 / 1.4</text>
  <text x="64"  y="532" class="mono" fill="rgba(28,28,31,0.60)" font-size="11" letter-spacing="1.8" font-weight="600" dx="120">EYEBROW LABELS, SECTION KICKERS</text>
  <line x1="64" y1="544" x2="1136" y2="544" stroke="rgba(28,28,31,0.08)"/>

  <!-- 10px mono micro -->
  <text x="64"  y="566" class="gauge ink-60">10 / 1.4</text>
  <text x="64"  y="566" class="mono" fill="rgba(28,28,31,0.40)" font-size="10" letter-spacing="1.7" font-weight="600" dx="120">MICRO META, TAGS, AND DATA POINTS</text>

  <!-- Footer / meta strip -->
  <line x1="64" y1="640" x2="1136" y2="640" stroke="rgba(28,28,31,0.12)" stroke-width="1"/>
  <text x="64"  y="676" class="label ink-40">DISPLAY</text>
  <text x="64"  y="708" class="mono" fill="#1c1c1f" font-size="13">Inter, 700, tracking -0.024em</text>
  <text x="416" y="676" class="label ink-40">BODY</text>
  <text x="416" y="708" class="mono" fill="#1c1c1f" font-size="13">Inter, 400 to 600</text>
  <text x="720" y="676" class="label ink-40">MONO</text>
  <text x="720" y="708" class="mono" fill="#1c1c1f" font-size="13">JetBrains Mono, 500 to 600</text>
</svg>
