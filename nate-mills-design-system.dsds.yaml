name: "Nate Mills Design System"
entries:
  - id: "nate-mills-design-system"
    kind: "system"
    name: "Nate Mills Design System"
    description: "The design system behind natemills.me: DTCG tokens, generated CSS and a small published class API. Every component and published token is an entry in this document, and every helper class (a published class that is not a component) is a set of guidelines on this system entry; anything not listed is not in the system."
    purpose: "A CSS class API, not a JavaScript component library: each component is a set of classes on plain HTML, so its traits are those classes and attributes. Not in this system: text field, checkbox, radio button, select, switch, slider, dialog or modal, tooltip, popover, accordion, toast, table, pagination dots."
    metadata:
      version: "4.0.0"
      organization: "Nate Mills"
      url: "https://github.com/n8mills-UI/nate-mills-design-system"
      license: "MIT"
      platforms:
        - "web"
      status:
        status: "stable"
      origin:
        method: "generated"
        author: "machine-generated"
        note: "Generated by portfolio/tokens/dsds.mjs from the same sources as the component pages."
    refs:
      - href: "./COMPONENTS.md"
        rel: "see-also"
        role: "component index"
      - href: "./foundations/README.md"
        rel: "see-also"
        role: "foundation pages"
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
      - href: "./foundations/accessibility.md#screen-reader-text"
        rel: "see-also"
        role: "helper class: Screen-reader text"
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        title: "Screen-reader text (.sr-only): when to use"
        items:
          - statement: "Use it for: The \"(opens in a new tab)\" cue on a text link that leaves the site."
            level: "may"
          - statement: "Use it for: The \"Loading\" line in a Loading card."
            level: "may"
          - statement: "Use it for: Any word a sighted reader gets from the layout and a screen-reader user would miss."
            level: "may"
          - statement: "Not for: Text a sighted reader needs: show it."
            level: "should-not"
          - statement: "Not for: The name of an icon-only button: that is its `aria-label`."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        title: "Screen-reader text (.sr-only): how to use"
        items:
          - statement: "Element: `<span class=\"sr-only\">`"
            level: "should"
          - statement: "Put `.sr-only` on a `<span>` inside the element it describes, holding the words to announce."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        title: "Screen-reader text (.sr-only): rules"
        items:
          - id: "screen-reader-text-rule-1"
            statement: "Use the one phrase \"(opens in a new tab)\" for the cue on a text link that leaves the site."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#external-link-lint"
                rel: "lint-rule"
                role: "External-link lint"
            tags:
              - "rule"
          - id: "screen-reader-text-rule-2"
            statement: "Hide words a sighted reader needs."
            level: "must-not"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#hidden-words-review"
                rel: "see-also"
                role: "Hidden-words review"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        title: "Screen-reader text (.sr-only): never"
        items:
          - statement: "`.sr-only` with `aria-hidden=\"true\"`: It is then hidden from the screen and the screen reader, so nobody gets the words."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.sr-only` on words a sighted reader needs: They vanish from the screen."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.sr-only` as the name of an icon-only button: Use the button's `aria-label`."
            level: "should-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        title: "Screen-reader text (.sr-only): keys"
        items:
          - term: "Tab"
            definition: "Passes over plain `.sr-only` text. On a focusable element, such as a skip link, Tab stops there and the element shows while it has focus."
          - term: "Enter"
            definition: "Does nothing on plain text; follows a focused skip link."
          - term: "Down arrow in a screen reader's browse mode (VoiceOver: VO + Right arrow)"
            definition: "Reads the hidden words in place, as part of the element they sit in."
  - id: "button"
    kind: "component"
    name: "Button"
    description: "A standalone action, or a call to action that goes somewhere: a full pill with a large pointer target."
    purpose: "`<button type=\"button\">` for an action on this page; `<a href>` for a call to action that goes somewhere."
    metadata:
      status:
        status: "stable"
    related:
      - to: "link"
        rel: "alternative-to"
        note: "Words inside running text that take you somewhere are a Link. A standalone action or call to action is a Button."
      - to: "chip"
        rel: "alternative-to"
        note: "A chip only labels and never takes a click. If the thing must do something, it is a Button."
      - to: "card"
        rel: "alternative-to"
        note: "A card with one destination becomes that link itself. A card with several actions stays static and puts a Button on each action."
      - to: "carousel-navigation"
        rel: "alternative-to"
        note: "Paging a carousel is the bare chevrons of Carousel navigation. A labelled action under a carousel is a Button."
      - to: "avatar"
        rel: "alternative-to"
        note: "Both are circles. An avatar is a person and never acts; an icon button is a control."
      - to: "tabs"
        rel: "alternative-to"
        note: "A Button runs an action once; a tab selects a panel and stays selected."
    refs:
      - href: "./components/button.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "variant"
        name: "variant"
        description: "How prominent the button is."
        setBy: "consumer"
        values:
          - id: "primary"
            name: ".btn--primary"
            description: "Lime fill, ink label; inverts to an ink fill on hover. The one main action in a view."
          - id: "secondary"
            name: ".btn--secondary"
            description: "Transparent with a grey outline; fills lime on hover. Every other action, and the only one allowed on a lime surface."
          - id: "icon"
            name: ".btn--icon"
            description: "A circle holding one glyph and no words; needs an `aria-label`."
      - kind: "enum"
        id: "size"
        name: "size"
        description: "Height and padding. An icon button stays a circle at every size."
        setBy: "consumer"
        values:
          - id: "sm"
            name: ".btn--sm"
            description: "32px high, for dense toolbars and filters only."
          - id: "md"
            name: ".btn--md"
            description: "44px high, with tighter padding than the base."
          - id: "lg"
            name: ".btn--lg"
            description: "52px high, for hero calls to action."
      - kind: "boolean"
        id: "disabled"
        name: "disabled"
        description: "On a `<button>`: dims it, stops pointer input and takes it out of the Tab order."
        setBy: "consumer"
    combos:
      - subject: "variant.primary"
        items:
          - "variant.secondary"
          - "variant.icon"
        level: "must-not"
        note: "One variant at a time: two variants on one element tie, so the result depends on stylesheet order."
      - subject: "variant.secondary"
        items:
          - "variant.icon"
        level: "must-not"
        note: "One variant at a time: two variants on one element tie, so the result depends on stylesheet order."
      - subject: "size.sm"
        items:
          - "size.md"
          - "size.lg"
        level: "must-not"
        note: "One size at a time: two sizes on one element tie, so the result depends on stylesheet order."
      - subject: "size.md"
        items:
          - "size.lg"
        level: "must-not"
        note: "One size at a time: two sizes on one element tie, so the result depends on stylesheet order."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: An action on this page, such as submitting, opening or toggling something."
            level: "may"
          - statement: "Use it for: A standalone call to action that leaves the page, such as \"Read the case study\" or \"Get in touch\"."
            level: "may"
          - statement: "Use it for: An icon-only chrome control, such as a theme toggle or a menu button."
            level: "may"
          - statement: "Not for: A destination inside a sentence: use a Link."
            level: "should-not"
          - statement: "Not for: A label or a tag: use a Chip. A status: use a Badge."
            level: "should-not"
          - statement: "Not for: Paging through a carousel: use Carousel navigation."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<button type=\"button\">` for an action on this page; `<a href>` for a call to action that goes somewhere."
            level: "should"
          - statement: "Put `.btn` and exactly one variant class on a `<button type=\"button\">` for an action, or on an `<a href>` for a destination."
            level: "should"
          - statement: "For an icon-only control, use `.btn--icon` and give it an `aria-label`. A `.sr-only` span adds words to content; it never names a control."
            level: "should"
          - statement: "Add a size class only for a dense toolbar (`.btn--sm`) or a hero call to action (`.btn--lg`)."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Keep the pointer target at least 44px. `.btn--sm` at 32px is the one exception, for dense toolbars, and still clears the 24px AA floor."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#touch-target-lint"
                rel: "lint-rule"
                role: "Touch-target lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Show the focus ring on keyboard focus; never remove the outline without a replacement."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#tab-walk-focus-ring"
                rel: "test"
                role: "Tab walk: focus ring"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Keep the label and glyph readable on hover, focus and press: 4.5:1 for text, 3:1 for an icon."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#state-contrast-gate"
                rel: "test"
                role: "State-contrast gate"
            tags:
              - "rule"
          - id: "rule-4"
            statement: "Give every `.btn--icon` an `aria-label`."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#axe-accessibility-scan"
                rel: "test"
                role: "axe accessibility scan"
            tags:
              - "rule"
          - id: "rule-5"
            statement: "Give a button that leaves the site `target=\"_blank\"`, `rel=\"noopener noreferrer\"`, a trailing `arrow-up-right` glyph and an \"opens in a new tab\" cue."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#external-link-lint"
                rel: "lint-rule"
                role: "External-link lint"
            tags:
              - "rule"
          - id: "rule-6"
            statement: "Put `.btn--primary` on a lime surface."
            level: "must-not"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#lime-surface-review"
                rel: "see-also"
                role: "Lime-surface review"
            tags:
              - "rule"
          - id: "rule-7"
            statement: "Reach for `.btn--sm` sparingly; it is for dense toolbars, not a default."
            level: "should"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#dense-button-review"
                rel: "see-also"
                role: "Dense-button review"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`variant: primary` with `variant: secondary`, or any two variants on one button: The rules tie, so the look depends on stylesheet order."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`size: sm` with `size: lg`, or any two sizes on one button: The rules tie, so the height depends on stylesheet order."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.btn` with no `variant`: The base class sets no fill or colour, so the button renders blank."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`variant: primary` on a lime surface: Lime on lime hides the button. Use `variant: secondary` there."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`variant: primary` or `variant: secondary` with a glyph and no words: An icon-only control is `variant: icon`."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`variant: icon` with no `aria-label`: The button has no visible words, so it would have no name."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Tab"
            definition: "Moves focus to the button and shows the focus ring. A `<button disabled>` is skipped."
          - term: "Shift + Tab"
            definition: "Moves focus back to the previous control."
          - term: "Enter"
            definition: "Activates a `<button>`; follows an `<a>`."
          - term: "Space"
            definition: "Activates a `<button>`. On an `<a>` it scrolls the page, as on every link."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "variant"
            definition: "Modifier class. Allowed: primary (.btn--primary), secondary (.btn--secondary), icon (.btn--icon). Default: None. Required: `.btn` alone sets no fill or colour. How prominent the button is."
          - term: "size"
            definition: "Modifier class. Allowed: sm (.btn--sm), md (.btn--md), lg (.btn--lg). Default: No size class: the base `.btn`, 44px high. Height and padding. An icon button stays a circle at every size."
          - term: "type"
            definition: "Attribute. Allowed: `button`, `submit`, `reset`. Default: `submit`, the HTML default. Set `button` for any action that does not submit a form. On a `<button>` only."
          - term: "disabled"
            definition: "Attribute, boolean. Allowed: present or absent. Default: Absent. On a `<button>`: dims it, stops pointer input and takes it out of the Tab order."
          - term: "aria-disabled"
            definition: "Attribute. Allowed: `true`. Default: Absent. For a disabled link: set it with `role=\"link\"` and remove the `href`. The button dims the same way."
          - term: "aria-label"
            definition: "Attribute, string. Allowed: Text naming the action. Default: None. Required on the `icon` variant, which has no visible words."
  - id: "card"
    kind: "component"
    name: "Card"
    description: "A bounded container on the surface step with a hairline border; clickable as a whole only with the interactive class."
    purpose: "`<div>` or `<article>` for a static card; `<a href>` or `<button>` when the whole card is the target."
    metadata:
      status:
        status: "stable"
    related:
      - to: "loading-card"
        rel: "alternative-to"
        note: "While the content is still on its way, show a Loading card; swap in the Card when it arrives."
      - to: "button"
        rel: "alternative-to"
        note: "A card holding several actions stays static and puts a Button on each action. Only a card with exactly one destination becomes `.card--interactive`."
    refs:
      - href: "./components/card.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "tone"
        name: "tone"
        description: "Which surface the card sits on."
        setBy: "consumer"
        values:
          - id: "dark"
            name: ".card--dark"
            description: "For an always-dark slab: ink surface, on-ink text and border, in both themes."
      - kind: "enum"
        id: "density"
        name: "density"
        description: "Inner padding."
        setBy: "consumer"
        values:
          - id: "compact"
            name: ".card--compact"
            description: "16px padding."
          - id: "spacious"
            name: ".card--spacious"
            description: "32px padding."
      - kind: "enum"
        id: "interactive"
        name: "interactive"
        description: "Whether the whole card answers the pointer. Put it on a real `<a>` or `<button>`, or on a card whose one control is a `<button aria-expanded>` that opens it in place."
        setBy: "consumer"
        values:
          - id: "interactive"
            name: ".card--interactive"
            description: "The one clickable-card hover: the border strengthens and the card lifts, with no fill."
      - kind: "enum"
        id: "state"
        name: "state"
        description: "A message in place of content. For loading, see Loading card."
        setBy: "consumer"
        values:
          - id: "empty"
            name: ".card--empty"
            description: "A centred empty message."
          - id: "error"
            name: ".card--error"
            description: "A centred error message carrying the feedback colour."
    combos:
      - subject: "density.compact"
        items:
          - "density.spacious"
        level: "must-not"
        note: "One density at a time: two densities on one element tie, so the result depends on stylesheet order."
      - subject: "state.empty"
        items:
          - "state.error"
        level: "must-not"
        note: "One state at a time: two states on one element tie, so the result depends on stylesheet order."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: A self-contained piece of content: a project, a credential, a metric, a quote."
            level: "may"
          - statement: "Use it for: A whole surface that goes to exactly one place."
            level: "may"
          - statement: "Use it for: An empty or error message in the place a card would sit."
            level: "may"
          - statement: "Not for: A row in a list: rows answer the pointer with a background wash, not a card lift."
            level: "should-not"
          - statement: "Not for: Content still loading: use a Loading card."
            level: "should-not"
          - statement: "Not for: A label or a status inside a card: use a Chip or a Badge."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<div>` or `<article>` for a static card; `<a href>` or `<button>` when the whole card is the target."
            level: "should"
          - statement: "Put `.card` on a `<div>` or `<article>`."
            level: "should"
          - statement: "When the whole card goes to one place, make the card itself the `<a href>` or `<button>` and add `.card--interactive`."
            level: "should"
          - statement: "When the whole card opens and closes in place, keep it an `<article>`, give it one `<button aria-expanded>` as its only control, and add `.card--interactive`; a click anywhere on the card works that button."
            level: "should"
          - statement: "For a message in place of content, add `.card--empty` or `.card--error`; on an always-dark slab, add `.card--dark`."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Make a whole-card target a real `<a>` or `<button>`, or, for a card that opens in place, give it exactly one `<button aria-expanded>`. `.card--interactive` styles the hover; it does not make the card operable."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Give a static `.card` a hover state; only `.card--interactive` answers the pointer."
            level: "must-not"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#mobile-consistency-lint"
                rel: "lint-rule"
                role: "Mobile-consistency lint"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Show the focus ring on an interactive card."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#tab-walk-focus-ring"
                rel: "test"
                role: "Tab walk: focus ring"
            tags:
              - "rule"
          - id: "rule-4"
            statement: "Keep text readable on an interactive card in hover, focus and press."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#state-contrast-gate"
                rel: "test"
                role: "State-contrast gate"
            tags:
              - "rule"
          - id: "rule-5"
            statement: "Give a card a drop shadow."
            level: "must-not"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#mobile-consistency-lint"
                rel: "lint-rule"
                role: "Mobile-consistency lint"
            tags:
              - "rule"
          - id: "rule-6"
            statement: "Change density with `.card--compact` or `.card--spacious` rather than a padding override."
            level: "should"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#card-padding-review"
                rel: "see-also"
                role: "Card-padding review"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`interactive` on a `<div>` or `<article>` with a click handler: Keyboard users can never reach it. The interactive card must itself be an `<a href>` or a `<button>`."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`interactive` with a link, or more than one button, inside it: A control inside a link or button is invalid HTML, and two controls leave the card's one target unclear. The one inner control allowed is the `<button aria-expanded>` of a card that opens in place. A card with several actions stays static."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`density: compact` with `density: spacious`: The padding rules tie, so the padding depends on stylesheet order."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`state: empty` with `state: error`: One card carries one message."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "Any card with a `data-theme` attribute pinned on it: The pin survives when the card is cloned and breaks dark mode. Use `tone: dark` for a dark slab."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Tab (interactive card)"
            definition: "Moves focus to the card, which is itself the `<a>` or `<button>`, and shows the focus ring."
          - term: "Tab (card that opens in place)"
            definition: "Moves focus to its one `<button aria-expanded>` and shows the focus ring; the card's border strengthens."
          - term: "Tab (static card)"
            definition: "Passes over the card and moves to the links or buttons inside it."
          - term: "Enter"
            definition: "Follows an interactive link card, activates a button card, or opens and closes a card that opens in place."
          - term: "Space"
            definition: "Activates a button card, or opens and closes a card that opens in place; scrolls the page on a link card."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "tone"
            definition: "Modifier class. Allowed: dark (.card--dark). Default: No class: the surface follows the page theme. Which surface the card sits on."
          - term: "density"
            definition: "Modifier class. Allowed: compact (.card--compact), spacious (.card--spacious). Default: No class: 24px padding. Inner padding."
          - term: "interactive"
            definition: "Modifier class. Allowed: interactive (.card--interactive). Default: No class: static, with no hover. Whether the whole card answers the pointer. Put it on a real `<a>` or `<button>`, or on a card whose one control is a `<button aria-expanded>` that opens it in place."
          - term: "state"
            definition: "Modifier class. Allowed: empty (.card--empty), error (.card--error). Default: No class: normal content. A message in place of content. For loading, see Loading card."
  - id: "loading-card"
    kind: "component"
    name: "Loading card"
    description: "A card standing in for content on its way: skeleton bars, one per line of what is coming."
    purpose: "`<div class=\"card card--loading\">` holding `.card-skel` bars and a `.sr-only` \"Loading\" line."
    metadata:
      status:
        status: "stable"
    related:
      - to: "card"
        rel: "alternative-to"
        note: "The Card is the finished state. The Loading card holds its place until the content arrives, then the Card replaces it."
    refs:
      - href: "./components/loading-card.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "bar"
        name: "bar"
        description: "The shape of one skeleton bar. Repeat `.card-skel` once per line of the coming content."
        setBy: "consumer"
        values:
          - id: "media"
            name: ".card-skel--media"
            description: "A media block."
          - id: "title"
            name: ".card-skel--title"
            description: "A title line."
          - id: "line"
            name: ".card-skel--line"
            description: "A line of body copy."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: Content that takes a moment to arrive, in the place its card will sit."
            level: "may"
          - statement: "Not for: Content that is already there: use a Card."
            level: "should-not"
          - statement: "Not for: Nothing to show at all: use the empty state of a Card."
            level: "should-not"
          - statement: "Not for: A failure: use the error state of a Card."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<div class=\"card card--loading\">` holding `.card-skel` bars and a `.sr-only` \"Loading\" line."
            level: "should"
          - statement: "Add `.card--loading` to a `.card`."
            level: "should"
          - statement: "Inside it, add one `.card-skel` bar per line of the coming content, each with one size class."
            level: "should"
          - statement: "Add `<span class=\"sr-only\">Loading</span>`, so a screen reader hears what the bars show."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Fill `.card--loading` with `.card-skel` bars, one per line of the content it stands in for."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Add `<span class=\"sr-only\">Loading</span>`, so a screen reader hears what the bars show."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Stop the shimmer under reduced motion; components.css already does, so keep it when you restyle the bars."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`.card--loading` with no `.card-skel` bars inside: It renders as an empty box."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.card-skel` with no `bar` size: The bar has no shape."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.card-skel` outside a `.card--loading`: The bars are made to sit inside a loading card."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.card--loading` with the `empty` or `error` state of a Card: A card shows one state at a time."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Down arrow in a screen reader's browse mode (VoiceOver: VO + Right arrow)"
            definition: "Reads the `.sr-only` \"Loading\" line. The skeleton bars are empty boxes, so nothing else is read."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "bar"
            definition: "Modifier class. Allowed: media (.card-skel--media), title (.card-skel--title), line (.card-skel--line). Default: None. Required: every `.card-skel` takes one size. The shape of one skeleton bar. Repeat `.card-skel` once per line of the coming content."
  - id: "chip"
    kind: "component"
    name: "Chip"
    description: "A read-only label pill in the mono label type: a skill, a tag, a role."
    purpose: "`<span>`"
    metadata:
      status:
        status: "stable"
    related:
      - to: "badge"
        rel: "alternative-to"
        note: "Same pill shape, different job: a chip labels, a badge reports a status. Pick by what the words do."
      - to: "button"
        rel: "alternative-to"
        note: "A chip never takes a click. If a tag has to act, it is a Button."
      - to: "section-heading"
        rel: "alternative-to"
        note: "A section label names a part of the page; a chip labels a thing inside it."
    refs:
      - href: "./components/chip.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "variant"
        name: "variant"
        description: "How much weight the chip carries."
        setBy: "consumer"
        values:
          - id: "outline"
            name: ".chip--outline"
            description: "The fill drops out, for quieter contexts."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: A label or a tag that describes something: a skill, a discipline, a role."
            level: "may"
          - statement: "Not for: A status, such as \"Open to work\": use a Badge."
            level: "should-not"
          - statement: "Not for: A position in a carousel: use the Carousel navigation counter."
            level: "should-not"
          - statement: "Not for: Anything clickable: use a Button or a Link."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<span>`"
            level: "should"
          - statement: "Put `.chip` on a `<span>` with the label as its text."
            level: "should"
          - statement: "Add `.chip--outline` where the filled chip carries too much weight."
            level: "should"
          - statement: "A leading Lucide glyph is optional; mark it `aria-hidden=\"true\"`."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Make a `.chip` interactive."
            level: "must-not"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Mark a leading glyph `aria-hidden=\"true\"`."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Report a status on a chip."
            level: "must-not"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#label-or-status-review"
                rel: "see-also"
                role: "Label-or-status review"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`.chip` on a `<button>` or an `<a>`: A chip is a label, with no focus or pressed state."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.chip` with a status word, such as \"Open to work\": A status is a Badge."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`icon` with no `aria-hidden=\"true\"`: The word carries the meaning; a screen reader should not read the glyph."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Down arrow in a screen reader's browse mode (VoiceOver: VO + Right arrow)"
            definition: "Reads the label word. A leading glyph is `aria-hidden`, so it is skipped."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "variant"
            definition: "Modifier class. Allowed: outline (.chip--outline). Default: No class: a sunken fill. How much weight the chip carries."
          - term: "icon"
            definition: "Child element. Allowed: A leading Lucide `<i data-lucide=\"...\" aria-hidden=\"true\">`. Default: None. Optional. Sized by the chip; always `aria-hidden`, so the word carries the meaning."
  - id: "badge"
    kind: "component"
    name: "Badge"
    description: "A read-only status or count pill: a hairline outline, a word, and an optional lime dot or glyph."
    purpose: "`<span>`"
    metadata:
      status:
        status: "stable"
    related:
      - to: "chip"
        rel: "alternative-to"
        note: "Same pill shape, different job: a badge reports a status, a chip labels. Pick by what the words do."
      - to: "carousel-navigation"
        rel: "alternative-to"
        note: "A position in a carousel (\"2 / 6\") is the carousel counter, not a badge."
    refs:
      - href: "./components/badge.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: A status, such as \"Open to work\" or \"In progress\"."
            level: "may"
          - statement: "Use it for: A read-only count of something, outside a carousel."
            level: "may"
          - statement: "Not for: A plain label or tag: use a Chip."
            level: "should-not"
          - statement: "Not for: A position in a carousel: use the Carousel navigation counter."
            level: "should-not"
          - statement: "Not for: Anything clickable: use a Button or a Link."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<span>`"
            level: "should"
          - statement: "Put `.badge` on a `<span>` with the status word as its text."
            level: "should"
          - statement: "For the dot form, start it with `<span class=\"badge__dot\" aria-hidden=\"true\"></span>`; for the icon form, a Lucide glyph marked `aria-hidden=\"true\"`."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Give every status a word as well as the dot; colour is never the only signal (WCAG 1.4.1)."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Mark `.badge__dot` `aria-hidden=\"true\"`."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Make `.badge` interactive."
            level: "must-not"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`form: dot` with `form: icon`: Pick one form; two leading marks read as two signals."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.badge` on a `<button>` or an `<a>`: A badge reports, it never acts."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`form: dot` with no word beside it: Colour alone reaches no screen reader."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Down arrow in a screen reader's browse mode (VoiceOver: VO + Right arrow)"
            definition: "Reads the status word. The `.badge__dot` is `aria-hidden`, so it is skipped."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "form"
            definition: "Child element. Allowed: `dot`: a `<span class=\"badge__dot\" aria-hidden=\"true\">`; `icon`: a leading Lucide `<i data-lucide=\"...\" aria-hidden=\"true\">`; `plain`: words only. Default: `plain` What leads the word. The dot stays lime in both themes."
  - id: "section-heading"
    kind: "component"
    name: "Section heading"
    description: "The heading block every section opens with: a display title that draws its own brand period, an optional intro line, and small mono labels for sub-sections."
    purpose: "`<div class=\"section-head\">` around an `<h2 class=\"section-title\">` (an `<h3>` inside a section), a `<p class=\"section-subtitle\">`, and `<p class=\"section-label\">` for a sub-section label."
    metadata:
      status:
        status: "stable"
    related:
      - to: "chip"
        rel: "alternative-to"
        note: "A section label names a part of the page; a Chip labels a thing inside it. Neither is clickable."
    refs:
      - href: "./components/section-heading.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "label-variant"
        name: "label variant"
        description: "Applies to `.section-label` only. `.section-title`, `.section-subtitle` and `.section-head` take no modifiers."
        setBy: "consumer"
        values:
          - id: "accent"
            name: ".section-label--accent"
            description: "Accent-emphasis colour, for labels on marquee cards."
          - id: "center"
            name: ".section-label--center"
            description: "Centred."
          - id: "icon"
            name: ".section-label--icon"
            description: "Led by a decorative glyph."
          - id: "row"
            name: ".section-label--row"
            description: "A full-width heading row rather than an inline tag."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: The start of every page section."
            level: "may"
          - statement: "Use it for: A one-line intro under a section title."
            level: "may"
          - statement: "Use it for: A small label for a sub-section further down the page."
            level: "may"
          - statement: "Not for: A card title: use a plain heading inside the Card."
            level: "should-not"
          - statement: "Not for: An eyebrow above the section title: that tier was retired."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<div class=\"section-head\">` around an `<h2 class=\"section-title\">` (an `<h3>` inside a section), a `<p class=\"section-subtitle\">`, and `<p class=\"section-label\">` for a sub-section label."
            level: "should"
          - statement: "Wrap the title in `.section-head` and put `.section-title` on the heading element."
            level: "should"
          - statement: "Put `.section-subtitle` on the intro `<p>`."
            level: "should"
          - statement: "Put `.section-label` on a sub-section label `<p>`, with a variant class only when the layout needs it."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Type a full stop after a `.section-title`."
            level: "must-not"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Let `.section-head` own the gap below the heading; add no top margin to what follows."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#section-head-gate"
                rel: "test"
                role: "Section-head gate"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Pick the heading level for where it sits: `<h2>` for a page section, `<h3>` inside one."
            level: "should"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#screen-reader-structure-gate"
                rel: "test"
                role: "Screen-reader structure gate"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`.section-title` with a typed full stop at the end: The `::after` already draws the brand period, so it doubles."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.section-label` directly above a `.section-title`: That eyebrow tier was retired; the label is for sub-sections."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.section-head` with a top margin on the element after it: The block owns that gap."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`label variant` on `.section-title`, `.section-subtitle` or `.section-head`: Only `.section-label` takes the variants."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "H in a screen reader's browse mode (VoiceOver: VO + Command + H)"
            definition: "Moves to the next heading. `.section-title` sits on a real `<h2>` or `<h3>`, so it is in the list."
          - term: "2 or 3 in browse mode (NVDA, JAWS)"
            definition: "Moves to the next heading at that level."
          - term: "Down arrow in a screen reader's browse mode (VoiceOver: VO + Right arrow)"
            definition: "Reads the title, then the `.section-subtitle` intro. The brand period is drawn by CSS and is not read."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "level"
            definition: "Element. Allowed: `h2`, `h3`, or any heading level. Default: `h2` for a page section The heading element under `.section-title`, picked for where it sits: `h3` inside a section."
          - term: "label variant"
            definition: "Modifier class. Allowed: accent (.section-label--accent), center (.section-label--center), icon (.section-label--icon), row (.section-label--row). Default: No class: a left-aligned inline label. Applies to `.section-label` only. `.section-title`, `.section-subtitle` and `.section-head` take no modifiers."
  - id: "link"
    kind: "component"
    name: "Link"
    description: "Words that take you somewhere, underlined with a border so the line colours and animates on its own."
    purpose: "`<a href>`"
    metadata:
      status:
        status: "stable"
    related:
      - to: "button"
        rel: "alternative-to"
        note: "A link navigates, a button acts. A standalone call to action that must stand out is a Button styled on an `<a>`."
    refs:
      - href: "./components/link.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "variant"
        name: "variant"
        description: "Where the link sits."
        setBy: "consumer"
        values:
          - id: "prose"
            name: ".link-underline--prose"
            description: "Inside body copy."
          - id: "icon"
            name: ".link-underline--icon"
            description: "Carries a trailing glyph, which takes `.icon-size-xs`."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: A destination inside running text."
            level: "may"
          - statement: "Use it for: A standalone text link, such as \"Verify the credential\"."
            level: "may"
          - statement: "Use it for: A text link with a trailing glyph."
            level: "may"
          - statement: "Not for: An action on this page: use a Button."
            level: "should-not"
          - statement: "Not for: The main call to action of a section: use a Button."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<a href>`"
            level: "should"
          - statement: "Put `.link-underline` on the `<a href>`."
            level: "should"
          - statement: "Add `.link-underline--prose` inside body copy."
            level: "should"
          - statement: "For a trailing glyph, add `.link-underline--icon` and give the glyph `.icon-size-xs`."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Render exactly one underline in every state."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#underline-gate"
                rel: "test"
                role: "Underline gate"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Give a link that leaves the site `target=\"_blank\"`, `rel=\"noopener noreferrer\"`, a trailing `arrow-up-right` glyph and a `.sr-only` \"(opens in a new tab)\" cue."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#external-link-lint"
                rel: "lint-rule"
                role: "External-link lint"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Show the focus ring on keyboard focus."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#tab-walk-focus-ring"
                rel: "test"
                role: "Tab walk: focus ring"
            tags:
              - "rule"
          - id: "rule-4"
            statement: "Give the trailing glyph in `.link-underline--icon` the `.icon-size-xs` class."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#component-rules-lint"
                rel: "lint-rule"
                role: "Component-rules lint"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`.link-underline` with a text-decoration underline: The border and the decoration render as a double line."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`variant: icon` with a glyph that has no `.icon-size-xs`: The glyph renders unsized."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.icon-size-xs` outside `variant: icon`: It does nothing there."
            level: "should-not"
            tags:
              - "invalid-combination"
          - statement: "`target=\"_blank\"` with no `rel=\"noopener noreferrer\"`: The new page could reach back into this tab."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "Any link with the `external-link` box glyph: The trailing glyph for a link that leaves the site is `arrow-up-right`."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Tab"
            definition: "Moves focus to the link and shows the focus ring."
          - term: "Shift + Tab"
            definition: "Moves focus back to the previous control."
          - term: "Enter"
            definition: "Follows the link."
          - term: "Space"
            definition: "Scrolls the page; it does not follow a link."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "variant"
            definition: "Modifier class. Allowed: prose (.link-underline--prose), icon (.link-underline--icon). Default: No class: a standalone underlined link. Where the link sits."
          - term: "href"
            definition: "Attribute, URL. Allowed: Any URL. Default: None. Required. Where the link goes."
          - term: "target"
            definition: "Attribute. Allowed: `_blank`. Default: Absent: opens in the same tab. Set on every link that leaves the site, with `rel`."
          - term: "rel"
            definition: "Attribute. Allowed: `noopener noreferrer`. Default: Absent. Required with `target=\"_blank\"`."
  - id: "tabs"
    kind: "component"
    name: "Tabs"
    description: "One row of tabs that switches panels in the same place: large tabs that head a view, compact tabs inside a card."
    purpose: "A `role=\"tablist\"` container with an `aria-label`, holding `<button type=\"button\" role=\"tab\">` tabs, each tied to a `role=\"tabpanel\"`."
    metadata:
      status:
        status: "stable"
    related:
      - to: "carousel-navigation"
        rel: "alternative-to"
        note: "Tabs swap panels in place; the carousel navigation moves along a track of cards. If the content scrolls sideways, it is a carousel."
      - to: "button"
        rel: "alternative-to"
        note: "A tab selects a panel and stays selected; a Button runs an action once."
    refs:
      - href: "./components/tabs.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "size"
        name: "size"
        description: "How large the tabs are and how the selected one is marked."
        setBy: "consumer"
        values:
          - id: "lg"
            name: ".tabs--lg"
            description: "Display-face tabs that head a whole view; the page draws the selected bar."
          - id: "compact"
            name: ".tabs--compact"
            description: "Mono caption tabs inside a card, each drawing its own underline when selected, at least 48px tall."
      - kind: "boolean"
        id: "aria-selected"
        name: "aria-selected"
        description: "Marks the chosen tab; the CSS reads it for the selected look."
        setBy: "consumer"
    combos:
      - subject: "size.lg"
        items:
          - "size.compact"
        level: "must-not"
        note: "One size at a time: two sizes on one element tie, so the result depends on stylesheet order."
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: Two or more panels of related content that share one place on the page, such as Tokens, CSS and JSON views of one card."
            level: "may"
          - statement: "Use it for: A view that switches between sibling sections, such as the components in a playground."
            level: "may"
          - statement: "Not for: Picking a slide in a carousel: use the Carousel navigation, a group of buttons."
            level: "should-not"
          - statement: "Not for: Switching a view mode such as List and Gallery: that is a segmented control, a radio group."
            level: "should-not"
          - statement: "Not for: Moving to another page: use a Link."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: A `role=\"tablist\"` container with an `aria-label`, holding `<button type=\"button\" role=\"tab\">` tabs, each tied to a `role=\"tabpanel\"`."
            level: "should"
          - statement: "Put `.tabs` and one size, `.tabs--lg` or `.tabs--compact`, on the `role=\"tablist\"` row."
            level: "should"
          - statement: "Put `.tab` on each `<button type=\"button\" role=\"tab\">`, with `aria-selected`, `aria-controls` and an `id` the panel names in `aria-labelledby`."
            level: "should"
          - statement: "Drive it with a script that moves focus with the arrow keys, Home and End, keeps one Tab stop, and shows the chosen panel."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Mark the row `role=\"tablist\"` with an `aria-label`, each tab `role=\"tab\"` with `aria-selected`, and each panel `role=\"tabpanel\"`."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#axe-accessibility-scan"
                rel: "test"
                role: "axe accessibility scan"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Keep one Tab stop on the row and move between tabs with the arrow keys."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#tab-walk-keyboard"
                rel: "test"
                role: "Tab walk: keyboard"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Make each tab a `<button type=\"button\">`."
            level: "must"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#tabs-review"
                rel: "see-also"
                role: "Tabs review"
            tags:
              - "rule"
          - id: "rule-4"
            statement: "Use tabs to pick a carousel slide or switch a view mode."
            level: "must-not"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#tabs-review"
                rel: "see-also"
                role: "Tabs review"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`.tabs--lg` with `.tabs--compact`: A row takes one size."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.tab` on an `<a>` that loads another page: Tabs swap panels in place; moving to another page is a Link."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.tabs` holding carousel slide pickers: A carousel picker is a group of buttons (Carousel navigation)."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Tab"
            definition: "Moves into the row on the chosen tab, then on to its panel."
          - term: "Left arrow, Right arrow"
            definition: "Move to the previous or next tab and show its panel, wrapping at the ends."
          - term: "Home, End"
            definition: "Move to the first or last tab and show its panel."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "size"
            definition: "Modifier class. Allowed: lg (.tabs--lg), compact (.tabs--compact). Default: None: pick one size; `.tabs` alone has no tab look. How large the tabs are and how the selected one is marked."
          - term: "aria-selected"
            definition: "Attribute, boolean. Allowed: `true` on the chosen tab, `false` on the rest. Default: None. Required on every tab. Marks the chosen tab; the CSS reads it for the selected look."
          - term: "aria-controls"
            definition: "Attribute, id reference. Allowed: The `id` of the tab's panel. Default: None. Required on every tab. Ties the tab to the panel it shows."
          - term: "icon"
            definition: "Child element. Allowed: A leading Lucide `<i data-lucide=\"...\" aria-hidden=\"true\">`. Default: None. Optional, on compact tabs; the word carries the meaning."
  - id: "carousel-navigation"
    kind: "component"
    name: "Carousel navigation"
    description: "The one pager for every carousel: a progress rail, bare chevrons around a mono counter, sitting below the cards."
    purpose: "A `role=\"group\"` container with an `aria-label`, two `<button type=\"button\">` chevrons, and a rail and counter hidden from assistive tech."
    metadata:
      status:
        status: "stable"
    related:
      - to: "badge"
        rel: "alternative-to"
        note: "The counter shows a position in the carousel (\"2 / 6\"); a Badge shows a status or a count of something else. Never show a carousel position in a badge."
      - to: "button"
        rel: "alternative-to"
        note: "The chevrons are bare glyphs with a hidden 44px target. A labelled action under a carousel is a Button."
      - to: "tabs"
        rel: "alternative-to"
        note: "The nav moves along a track of cards; Tabs swap panels in the same place. If nothing scrolls sideways, it is Tabs."
    refs:
      - href: "./components/carousel-navigation.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    traits:
      - kind: "enum"
        id: "variant"
        name: "variant"
        description: "How wide the rail runs."
        setBy: "consumer"
        values:
          - id: "full"
            name: ".ds-carousel-nav--full"
            description: "A full-width rail for mobile swipe carousels; hidden on wider screens."
      - kind: "boolean"
        id: "disabled"
        name: "disabled"
        description: "On the backward chevron at the first card, where it dims instead of hiding."
        setBy: "consumer"
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: Any carousel or horizontal track of cards, at any width."
            level: "may"
          - statement: "Use it for: A mobile swipe carousel that becomes a grid on wider screens."
            level: "may"
          - statement: "Not for: Pagination dots: this system has none."
            level: "should-not"
          - statement: "Not for: A status or a label: use a Badge or a Chip."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: A `role=\"group\"` container with an `aria-label`, two `<button type=\"button\">` chevrons, and a rail and counter hidden from assistive tech."
            level: "should"
          - statement: "Place `.ds-carousel-nav` below the cards, holding the rail with its fill, and the pager with the two chevrons around the counter."
            level: "should"
          - statement: "Add `.ds-carousel-nav--full` for a mobile swipe carousel."
            level: "should"
          - statement: "Drive it with a script that steps the track, updates the fill and the counter, and announces the position in a polite live region."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Keep the invisible 44px hit area on each `.ds-carousel-nav__arrow`."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#touch-target-lint"
                rel: "lint-rule"
                role: "Touch-target lint"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Label each chevron `<button>` with an `aria-label`."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#axe-accessibility-scan"
                rel: "test"
                role: "axe accessibility scan"
            tags:
              - "rule"
          - id: "rule-3"
            statement: "Announce the position through a polite live region, because the counter is hidden from assistive tech."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#screen-reader-structure-gate"
                rel: "test"
                role: "Screen-reader structure gate"
            tags:
              - "rule"
          - id: "rule-4"
            statement: "Keep the track a Tab stop only while it can scroll."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#tab-walk-keyboard"
                rel: "test"
                role: "Tab walk: keyboard"
            tags:
              - "rule"
          - id: "rule-5"
            statement: "Autoplay the carousel; there is no visible pause control (WCAG 2.2.2)."
            level: "must-not"
            checkedBy: "manual"
            checks:
              - href: "./foundations/checks.md#carousel-autoplay-review"
                rel: "see-also"
                role: "Carousel autoplay review"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`variant: full` on a screen wider than a phone: It is the mobile swipe variant, and the CSS hides it on wider screens."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.ds-carousel-nav` with a second, hand-built pager: There is one nav, site-wide."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`disabled` on a chevron with the chevron hidden: It dims instead, so the end of the rail stays visible."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.ds-carousel-nav` with an autoplay timer: There is no visible pause control (WCAG 2.2.2)."
            level: "must-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Tab"
            definition: "Moves to the carousel track while it can scroll (a labelled region), then to the backward and forward chevrons, each a labelled `<button>`."
          - term: "Enter or Space"
            definition: "Steps one card back or forward."
          - term: "Left arrow, Right arrow"
            definition: "Step one card back or forward while focus is inside the carousel track."
          - term: "Enter on the forward chevron at the last card"
            definition: "Rewinds to the first card; the chevron renames itself to say so first."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "variant"
            definition: "Modifier class. Allowed: full (.ds-carousel-nav--full). Default: No class: the compact nav below the cards. How wide the rail runs."
          - term: "parts"
            definition: "Element classes. Allowed: `.ds-carousel-nav__rail` (the track), `.ds-carousel-nav__fill` (the progress), `.ds-carousel-nav__pager` (groups the chevrons around the counter), `.ds-carousel-nav__arrow` (each chevron), `.ds-carousel-nav__count` (the \"N / total\" counter). Default: All five are used together. The pieces inside `.ds-carousel-nav`."
          - term: "aria-label"
            definition: "Attribute, string. Allowed: Text such as \"Next project\". Default: None. Required on each chevron. The chevrons have no visible words."
          - term: "disabled"
            definition: "Attribute, boolean. Allowed: present or absent. Default: Absent. On the backward chevron at the first card, where it dims instead of hiding."
  - id: "avatar"
    kind: "component"
    name: "Avatar"
    description: "A round portrait at the touch-target size."
    purpose: "`<span class=\"avatar\">` holding one `<img>`."
    metadata:
      status:
        status: "stable"
    related:
      - to: "button"
        rel: "alternative-to"
        note: "The avatar and the icon button are both circles. The avatar is a person; the icon button is a control."
    refs:
      - href: "./components/avatar.md"
        rel: "see-also"
        role: "component page"
    sourceFiles:
      - platform: "web"
        file: "./components.css"
    specs:
      - href: "./components-api.json"
        rel: "contract"
        role: "class API as data"
    imports:
      - platform: "web"
        code: "<link rel=\"stylesheet\" href=\"https://natemills.me/assets/tokens.css\">\n<link rel=\"stylesheet\" href=\"https://natemills.me/assets/components.css\">"
    sections:
      - kind: "guidelines"
        for: "all"
        framing: "when-to-use"
        items:
          - statement: "Use it for: A person's portrait beside their name, such as the site header or a quote."
            level: "may"
          - statement: "Not for: A brand mark or a logo: show it as an image, not a portrait."
            level: "should-not"
          - statement: "Not for: An icon-only control: use an icon Button."
            level: "should-not"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "Element: `<span class=\"avatar\">` holding one `<img>`."
            level: "should"
          - statement: "Put `.avatar` on a `<span>` holding one `<img>` with `alt`, `width` and `height`."
            level: "should"
          - statement: "If the portrait goes somewhere, wrap the span in a link; the link takes focus."
            level: "should"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - id: "rule-1"
            statement: "Give the `<img>` alt text naming the person."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#axe-accessibility-scan"
                rel: "test"
                role: "axe accessibility scan"
            tags:
              - "rule"
          - id: "rule-2"
            statement: "Give the `<img>` `width` and `height`, so the page does not shift as it loads."
            level: "must"
            checkedBy: "automated"
            checks:
              - href: "./foundations/checks.md#image-size-checks"
                rel: "lint-rule"
                role: "Image-size checks"
            tags:
              - "rule"
      - kind: "guidelines"
        for: "all"
        framing: "how-to-use"
        items:
          - statement: "`.avatar` with an `<img>` that has no `alt`: A screen reader gets nothing, or the file name."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.avatar` with an `<img>` that has no `width` and `height`: The page shifts when the image arrives."
            level: "must-not"
            tags:
              - "invalid-combination"
          - statement: "`.avatar` holding a brand logo: The circle crops a logo; an avatar is a person."
            level: "should-not"
            tags:
              - "invalid-combination"
      - kind: "definitions"
        for: "all"
        context: "keyboard"
        items:
          - term: "Tab"
            definition: "Passes over it: an avatar is not focusable. Wrapped in a link, Tab stops on the link."
          - term: "Enter"
            definition: "Does nothing on its own; follows the link when one wraps it."
          - term: "G in a screen reader's browse mode (VoiceOver: VO + Command + G)"
            definition: "Moves to the next image and reads the `<img>` alt text, the person's name."
      - kind: "definitions"
        for: "all"
        context: "terms"
        items:
          - term: "alt"
            definition: "Attribute on the `<img>`, string. Allowed: The person's name. Default: None. Required. What a screen reader says."
          - term: "width, height"
            definition: "Attributes on the `<img>`. Allowed: The image's own pixel size. Default: None. Required. Reserve the space before the image arrives."
